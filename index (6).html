<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пожелания по графику</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6fc;--card:#fff;--line:#e3e7f3;--text:#1c2033;--dim:#7a819b;--acc:#5b5bf0;--acc2:#9a6bff;--wk:#ff6b81;--ok:#1fa97a;--err:#e5484d;--chip:#eef0fb}
@media (prefers-color-scheme: dark){:root{--bg:#12141f;--card:#1b1e2d;--line:#2a2e44;--text:#eceefa;--dim:#8d94b3;--chip:#252940;--acc:#7c7cff;--acc2:#b08cff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
table td.n,table th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(90px + env(safe-area-inset-bottom,0))}
.hero{padding:22px 18px 40px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:640px;margin:-24px auto 0;padding:0 14px}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(60,60,140,.12)}
.tab{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--dim);padding:9px;border-radius:12px;cursor:pointer}
.tab.on{background:var(--chip);color:var(--acc)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(60,60,140,.07)}
.day{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.day.wk{color:var(--wk)}.day small{color:var(--dim);font-weight:500}
.seg{display:flex;gap:7px}
.chip{flex:1;min-height:50px;font:inherit;font-size:16px;border:0;background:var(--chip);color:var(--text);padding:10px 12px;border-radius:14px;cursor:pointer}
.chip.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600}
.chip.off.sel{background:var(--wk)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}.chips .chip{flex:1 1 auto;min-height:44px;font-size:14px;padding:8px 12px}
.big{text-align:center;font-size:30px;font-weight:700;margin:14px 0 4px;letter-spacing:.5px}
.sl{display:flex;align-items:center;gap:10px;margin-top:6px}.sl span{width:58px;font-size:13px;color:var(--dim)}
input[type=range]{flex:1;min-width:0;width:100%;height:44px;padding:0;margin:0;background:transparent;border:0;-webkit-appearance:none;appearance:none;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:rgba(120,128,170,.3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(120,128,170,.3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid #fff}
input{font:inherit;color:var(--text);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:not([type=range]){display:block;min-width:0;max-width:100%;min-height:50px;-webkit-appearance:none;appearance:none;text-align:left}
input:focus{outline:none;border-color:var(--acc)}
label{font-size:13px;color:var(--dim);display:block;margin:12px 0 5px}label:first-child{margin-top:0}
.send{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0));max-width:612px;margin:0 auto;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:16px;padding:15px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(91,91,240,.4);cursor:pointer}
.send:disabled{opacity:.45;box-shadow:none}
.msg{text-align:center;font-size:14px;margin:6px 0;min-height:20px;color:var(--ok)}.msg.err{color:var(--err)}
.scroll{overflow-x:auto;background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(60,60,140,.07)}
table{border-collapse:collapse;min-width:620px;width:100%}
th,td{padding:8px 5px;text-align:center;font-size:12px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}th.wk,td.wk{background:rgba(255,107,129,.08)}
td.n{text-align:left;font-weight:700;font-size:13px;padding-left:12px;min-width:140px}
td.o{color:var(--dim)}
.empty{padding:26px;text-align:center;color:var(--dim)}
.row2{display:flex;gap:8px;margin-top:12px}.row2 button{flex:1}
.btn{font:inherit;font-weight:600;border:0;background:var(--chip);color:var(--acc);padding:12px;border-radius:12px;cursor:pointer}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.sum{font-size:14px;background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:14px}
</style>
</head>
<body>
<div class="hero"><h1>Пожелания по графику</h1><p id="sub">Загрузка…</p></div>
<main>
  <div class="tabs" id="tabs" hidden>
    <button class="tab on" data-t="me">Мои смены</button>
    <button class="tab" data-t="all">Таблица</button>
    <button class="tab" data-t="set">Настройки</button>
  </div>
  <section id="me">
    <div class="card"><label for="fio">Фамилия Имя Отчество</label><input id="fio" placeholder="Иванова Мария Сергеевна" autocomplete="name"></div>
    <div id="days"></div>
    <div class="msg" id="msg" role="status"></div>
    <button class="send" id="send">Отправить</button>
  </section>
  <section id="all" hidden>
    <div class="scroll" id="tbl"></div>
    <div class="row2"><button class="btn" id="refresh">Обновить</button></div>
  </section>
  <section id="set" hidden>
    <div class="card">
      <label>Период, на который ждём пожелания</label>
      <div class="two"><div><label for="dFrom" style="margin-top:0">С</label><input type="date" id="dFrom"></div><div><label for="dTo" style="margin-top:0">По</label><input type="date" id="dTo"></div></div>
      <div class="chips"><button class="chip" id="nextWeek">Следующая неделя</button><button class="chip" id="week2">Через неделю</button></div>
      <label for="dlDate">Приём пожеланий заканчивается</label>
      <input type="date" id="dlDate">
      <div class="big" id="dlBig">18:00</div>
      <div class="sl"><span>Время</span><input type="range" id="dlTime" min="0" max="47" step="1" value="36"></div>
      <div class="sum" id="sum"></div>
      <div class="row2"><button class="btn main" id="saveSet">Сохранить</button></div>
      <div class="msg" id="setMsg"></div>
    </div>
  </section>
</main>
<script>
/* ===== НАСТРОЙКИ: замените значения ===== */
var SUPABASE_URL = "https://ВАШ-ПРОЕКТ.supabase.co";
var SUPABASE_KEY = "ВАШ-ANON-PUBLIC-KEY";
var ADMIN_IDS = ["123456789"];   // Telegram id администратора (узнать у @userinfobot)
/* ======================================= */
var DN = ["вс","пн","вт","ср","чт","пт","сб"];
var tg = window.Telegram && window.Telegram.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
var $ = function(i){ return document.getElementById(i); };
var pad = function(n){ return (n < 10 ? "0" : "") + n; };
var iso = function(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
var ddmm = function(d){ return pad(d.getDate()) + "." + pad(d.getMonth()+1); };
var toD = function(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); };
var addD = function(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
var hm = function(u){ return pad(Math.floor(u/2)) + ":" + (u % 2 ? "30" : "00"); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function monday(d){ return addD(d, -((d.getDay()+6)%7)); }
function dayList(){ var a = toD(settings.week), b = settings.date_to ? toD(settings.date_to) : addD(a, 6), o = []; for(var d = a; d <= b && o.length < 31; d = addD(d, 1)) o.push(d); return o; }
function unitOf(t){ var p = t.split(":"); return Math.round((+p[0]*60 + +p[1]) / 30); }
function parseShift(v){ var m = /^(\d\d:\d\d)-(\d\d:\d\d)$/.exec(v || ""); return m ? [Math.max(12, Math.min(46, unitOf(m[1]))), Math.max(13, Math.min(48, unitOf(m[2])))] : null; }

var tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
var me = tu ? String(tu.id) : (function(){ try{ var r = localStorage.getItem("gid") || ("web" + Math.random().toString(36).slice(2)); localStorage.setItem("gid", r); return r; }catch(e){ return "web1"; } })();
var DEMO = SUPABASE_URL.indexOf("ВАШ") >= 0;
var isAdmin = DEMO || ADMIN_IDS.indexOf(me) >= 0;
var settings = null, days = [], failed = false, mem = { settings: null, wishes: [] };

function demoApi(path, opt){
  var m = opt.method || "GET", q = path.split("?")[0], b = opt.body;
  if(q === "settings"){ if(m === "POST"){ mem.settings = b; return Promise.resolve(null); } return Promise.resolve(mem.settings ? [mem.settings] : []); }
  if(m === "POST"){ mem.wishes = mem.wishes.filter(function(x){ return !(x.week === b.week && x.tg_id === b.tg_id); }); mem.wishes.push(b); return Promise.resolve(null); }
  var mine = path.match(/tg_id=eq\.([^&]+)/), wk = path.match(/week=eq\.([^&]+)/)[1];
  return Promise.resolve(mem.wishes.filter(function(x){ return x.week === wk && (!mine || x.tg_id === decodeURIComponent(mine[1])); }));
}
function api(path, opt){
  opt = opt || {};
  if(DEMO) return demoApi(path, opt);
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
function closed(){ return !settings || new Date() > new Date(settings.deadline); }
function say(id, t, err){ var e = $(id); e.textContent = t; e.className = "msg" + (err ? " err" : ""); }

function renderSub(){
  if(failed) return;
  if(!settings){ $("sub").textContent = isAdmin ? "Задайте период во вкладке «Настройки»" : "Приём пожеланий ещё не открыт"; $("send").disabled = true; return; }
  var d = dayList(), dl = new Date(settings.deadline);
  $("sub").textContent = ddmm(d[0]) + " – " + ddmm(d[d.length-1]) + (closed() ? " · приём закрыт" : " · менять можно до " + ddmm(dl) + " " + pad(dl.getHours()) + ":" + pad(dl.getMinutes()));
  var l = closed() && !isAdmin; $("send").disabled = l; $("fio").disabled = l;
}

function renderDays(){
  var box = $("days"); box.innerHTML = "";
  if(!settings){ box.innerHTML = '<div class="card empty">' + (isAdmin ? "Откройте «Настройки», выберите период и срок приёма, и здесь появятся дни" : "Администратор ещё не открыл приём пожеланий") + '</div>'; return; }
  var lock = closed() && !isAdmin;
  dayList().forEach(function(d, i){
    var v = days[i] || "", sh = parseShift(v), c = document.createElement("div"); c.className = "card";
    var h = '<div class="day' + (d.getDay() % 6 === 0 ? " wk" : "") + '">' + DN[d.getDay()] + '<small>' + ddmm(d) + '</small></div>';
    h += '<div class="seg"><button class="chip off' + (v === "вых" ? " sel" : "") + '" data-i="' + i + '" data-m="off">Выходной</button><button class="chip' + (sh ? " sel" : "") + '" data-i="' + i + '" data-m="work">Работаю</button></div>';
    if(sh){
      h += '<div class="big" id="big' + i + '">' + hm(sh[0]) + ' – ' + hm(sh[1]) + '</div>';
      h += '<div class="sl"><span>Начало</span><input type="range" data-i="' + i + '" data-k="0" min="12" max="46" value="' + sh[0] + '"></div>';
      h += '<div class="sl"><span>Конец</span><input type="range" data-i="' + i + '" data-k="1" min="13" max="48" value="' + sh[1] + '"></div>';
    }
    c.innerHTML = h; box.appendChild(c);
    if(lock) c.querySelectorAll("button,input").forEach(function(x){ x.disabled = true; });
  });
}
$("days").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if(!b) return; var i = +b.dataset.i;
  if(b.dataset.m === "off") days[i] = "вых";
  else if(!parseShift(days[i])) days[i] = hm(18) + "-" + hm(36);
  renderDays();
});
$("days").addEventListener("input", function(e){
  var t = e.target; if(t.type !== "range") return; var i = +t.dataset.i, k = +t.dataset.k, p = t.parentNode.parentNode.querySelectorAll("input"), s = +p[0].value, en = +p[1].value;
  if(k === 0 && s >= en){ en = s + 1; p[1].value = en; }
  if(k === 1 && en <= s){ s = en - 1; p[0].value = s; }
  days[i] = hm(s) + "-" + hm(en); $("big" + i).textContent = hm(s) + " – " + hm(en);
});

$("send").addEventListener("click", function(){
  var name = $("fio").value.trim();
  if(!name) return say("msg", "Укажите ФИО", true);
  var bad = dayList().some(function(d, i){ return !days[i]; });
  if(bad) return say("msg", "Выберите «Выходной» или «Работаю» на каждый день", true);
  $("send").disabled = true;
  api("wishes?on_conflict=week,tg_id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: { week: settings.week, tg_id: me, name: name, days: days.slice(0, dayList().length), updated_at: new Date().toISOString() } })
  .then(function(){ try{ localStorage.setItem("fio", name); }catch(e){} say("msg", "Отправлено ✓ Менять можно до закрытия приёма"); if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); })
  .catch(function(){ say("msg", "Не получилось отправить, попробуйте ещё раз", true); })
  .then(renderSub);
});

function loadMine(){
  var saved = ""; try{ saved = localStorage.getItem("fio") || ""; }catch(e){}
  $("fio").value = saved || (tu ? [tu.last_name, tu.first_name].filter(Boolean).join(" ") : "");
  days = [];
  return api("wishes?week=eq." + settings.week + "&tg_id=eq." + encodeURIComponent(me) + "&select=name,days").then(function(r){
    if(r && r[0]){ $("fio").value = r[0].name; days = r[0].days || []; }
  });
}
function loadAll(){
  if(!settings){ $("tbl").innerHTML = '<div class="empty">Сначала задайте период</div>'; return; }
  api("wishes?week=eq." + settings.week + "&select=name,days&order=name").then(function(r){
    var d = dayList();
    var h = '<table><thead><tr><th></th>' + d.map(function(x){ return '<th class="' + (x.getDay() % 6 === 0 ? "wk" : "") + '">' + DN[x.getDay()] + '<br>' + ddmm(x) + '</th>'; }).join("") + '</tr></thead><tbody>';
    if(!r.length) h += '<tr><td colspan="' + (d.length+1) + '" class="empty">Пока никто не отправил</td></tr>';
    r.forEach(function(e){ h += '<tr><td class="n">' + esc(e.name) + '</td>' + d.map(function(x, i){ var v = (e.days || [])[i] || "";
      return '<td class="' + (x.getDay() % 6 === 0 ? "wk " : "") + (v === "вых" ? "o" : "") + '">' + (v === "вых" ? "вых" : esc(v).replace("-", "<br>")) + '</td>'; }).join("") + '</tr>'; });
    $("tbl").innerHTML = h + '</tbody></table>';
  }).catch(function(){ $("tbl").innerHTML = '<div class="empty">Не удалось загрузить</div>'; });
}
$("refresh").addEventListener("click", loadAll);

/* --- настройки --- */
function sumUpd(){
  $("dlBig").textContent = hm(+$("dlTime").value);
  var a = $("dFrom").value, b = $("dTo").value, c = $("dlDate").value;
  if(!a || !b || !c){ $("sum").textContent = "Выберите даты"; return; }
  var n = Math.round((toD(b) - toD(a)) / 864e5) + 1;
  $("sum").textContent = n < 1 ? "Дата «По» раньше даты «С»" : "Ждём пожелания на " + ddmm(toD(a)) + " – " + ddmm(toD(b)) + " (" + n + " дн.). Приём до " + ddmm(toD(c)) + " в " + hm(+$("dlTime").value) + ".";
}
function setWeek(off){ var m = addD(monday(new Date()), off); $("dFrom").value = iso(m); $("dTo").value = iso(addD(m, 6)); sumUpd(); }
$("nextWeek").addEventListener("click", function(){ setWeek(7); });
$("week2").addEventListener("click", function(){ setWeek(14); });
$("dFrom").addEventListener("change", function(){ var a = $("dFrom").value; if(a && (!$("dTo").value || $("dTo").value < a)) $("dTo").value = iso(addD(toD(a), 6)); sumUpd(); });
["dTo","dlDate","dlTime"].forEach(function(id){ $(id).addEventListener("input", sumUpd); });
$("saveSet").addEventListener("click", function(){
  var a = $("dFrom").value, b = $("dTo").value, c = $("dlDate").value;
  if(!a || !b || !c) return say("setMsg", "Заполните все даты", true);
  var n = Math.round((toD(b) - toD(a)) / 864e5) + 1;
  if(n < 1 || n > 31) return say("setMsg", "Период должен быть от 1 до 31 дня", true);
  var s = { id: 1, week: a, date_to: b, deadline: c + "T" + hm(+$("dlTime").value) };
  api("settings?on_conflict=id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: s })
  .then(function(){ settings = s; say("setMsg", "Сохранено ✓"); return loadMine(); })
  .then(function(){ renderSub(); renderDays(); }).catch(function(){ say("setMsg", "Не удалось сохранить", true); });
});
function fillSettings(){
  if(settings){ $("dFrom").value = settings.week; $("dTo").value = settings.date_to || iso(addD(toD(settings.week), 6)); var p = settings.deadline.split("T"); $("dlDate").value = p[0]; $("dlTime").value = unitOf(p[1]); }
  else { setWeek(7); $("dlDate").value = iso(addD(toD($("dFrom").value), -3)); }
  sumUpd();
}

document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === t); });
  ["me","all","set"].forEach(function(k){ $(k).hidden = k !== t.dataset.t; });
  $("send").hidden = t.dataset.t !== "me"; if(t.dataset.t === "all") loadAll();
}); });

if(isAdmin) $("tabs").hidden = false;
api("settings?id=eq.1&select=week,date_to,deadline").then(function(r){
  settings = r && r[0] || null; if(settings) return loadMine();
}).catch(function(){ failed = true; $("sub").textContent = "Не удалось подключиться к базе. Проверьте настройки в начале файла."; })
.then(function(){ fillSettings(); renderSub(); renderDays(); if(DEMO) $("sub").textContent += " · демо: данные только в этом окне"; });
</script>
</body>
</html>
